PACKAGE_NAME="pcie-rkep"
PACKAGE_VERSION="1.0.4"

BUILT_MODULE_NAME[0]="pcie-rkep"
# .ko is produced inside src/pcie-rkep/ (MAKE descends into that dir);
# the default "." would miss it.
BUILT_MODULE_LOCATION[0]="src/pcie-rkep"
# Land in the standard module tree at the same subpath the in-tree build
# used, so modprobe/depmod resolve it without any extra search path.
DEST_MODULE_LOCATION[0]="/kernel/drivers/misc/rockchip/"

# SDK Makefile takes KERNELDIR (its default targets `uname -r`, which is
# wrong inside DKMS chroot builds) — override with the target kernel.
MAKE[0]="make -C src/pcie-rkep KERNELDIR=/lib/modules/${kernelver}/build"
CLEAN="make -C src/pcie-rkep clean KERNELDIR=/lib/modules/${kernelver}/build"

AUTOINSTALL="yes"
