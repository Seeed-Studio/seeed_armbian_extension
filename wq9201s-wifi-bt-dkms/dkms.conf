PACKAGE_NAME="wq9201s-wifi-bt-dkms"
PACKAGE_VERSION="2.2.3.94"

BUILT_MODULE_NAME[0]="wq_wlan"
# .ko is produced in src/wifi/rwnx_drv/ (MAKE uses make -C to that dir);
# tell DKMS where to find it after build — default "." (root) would miss it.
BUILT_MODULE_LOCATION[0]="src/wifi/rwnx_drv"
DEST_MODULE_LOCATION[0]="/kernel/drivers/net/wireless/wq/"

# Driver Makefile takes KERNELDIR (not KSRC) and lives in src/wifi/rwnx_drv,
# which references ../../common for shared headers — keep the src/ layout.
MAKE[0]="make -C src/wifi/rwnx_drv KERNELDIR=/lib/modules/${kernelver}/build"
CLEAN="make -C src/wifi/rwnx_drv clean KERNELDIR=/lib/modules/${kernelver}/build"

AUTOINSTALL="yes"
