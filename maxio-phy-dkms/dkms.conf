PACKAGE_NAME="maxio-phy"
PACKAGE_VERSION="1.0.0"

BUILT_MODULE_NAME[0]="maxio"
# .ko lands in src/ next to the source (MAKE runs at package root)
BUILT_MODULE_LOCATION[0]="src"
DEST_MODULE_LOCATION[0]="/kernel/drivers/net/phy/"

MAKE[0]="make KSRC=/lib/modules/${kernelver}/build"
CLEAN="make clean KSRC=/lib/modules/${kernelver}/build"

AUTOINSTALL="yes"
